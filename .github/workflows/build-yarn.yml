name: Build Yarn Mappings (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g., 1.21.8, 1.21.4, master)'
        required: true
        default: '1.21.8'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout yarn repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mappings artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yarn-mappings-${{ github.event.inputs.branch }}
          path: |
            build/libs/*.jar
            mappings/**
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.event.inputs.branch }}-${{ github.run_number }}
          name: Yarn ${{ github.event.inputs.branch }} Build #${{ github.run_number }}
          files: build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
